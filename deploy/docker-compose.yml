# docker compose -f deploy/docker-compose.yml up -d
#
# Secrets come from .env only; config.yaml carries no secret and is baked into the image.
#
# NOTE: compose's env_file parser does NOT strip surrounding whitespace or trailing
# `# comments`, while the runtime's own loader does and warns. So a .env that works with
# `python -m aurion.runtime.app` can fail here. Put values straight after `=` and delete
# trailing comments on any line you edit.
services:
  aurion:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: aurion:latest
    container_name: aurion
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      AURION_CONFIG_PATH: /app/config.yaml
      # State lives in /app/state, NOT /app/data. They shared /app/data, so the named
      # volume for the database shadowed the repo's data/ directory and the calendar file
      # vanished inside the container -- which crash-loops under restart: unless-stopped.
      AURION_DB_URL: sqlite+aiosqlite:////app/state/aurion.sqlite
      AURION_LOG_DIR: /app/logs
      AURION_CHART_DIR: /app/state/charts
      AURION_LOG_LEVEL: ${AURION_LOG_LEVEL:-INFO}
    volumes:
      # Durable state the container writes.
      - aurion-state:/app/state
      - aurion-logs:/app/logs
      # Operator-supplied config the container only reads. Bind-mounted so the calendar can
      # be replaced without rebuilding, and read-only so the process cannot alter it. The
      # path is identical to a non-Docker run, so one .env works for both.
      - ../data:/app/data:ro
    # Bounded so an unexpected memory climb restarts the container rather than invoking
    # the host OOM killer on a 1-2 GB box.
    deploy:
      resources:
        limits:
          memory: 900M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "/app/deploy/healthcheck.py"]
      interval: 60s
      timeout: 15s
      start_period: 120s
      retries: 3

volumes:
  aurion-state:
  aurion-logs:
