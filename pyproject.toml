[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurion"
version = "0.2.0"
description = "Signal-only trading alert system for XAUUSD and FX majors"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "numpy>=1.26",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9"]
notify = ["python-telegram-bot>=21.0", "mplfinance>=0.12.10b0"]

[tool.setuptools.packages.find]
include = ["aurion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.report]
# docs/04 §8 criterion 2: >=80% statement AND branch on analysis/
fail_under = 80
show_missing = true

[tool.coverage.run]
branch = true
source = ["aurion"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "DTZ"]
ignore = ["ANN401"]
# DTZ is deliberately on: naive datetimes are a bug class in this codebase.

[tool.ruff.lint.per-file-ignores]
# DTZ001 is allowed in tests because several tests construct a naive datetime
# deliberately, to assert that it is rejected. That construction IS the test.
"tests/*" = ["ANN", "DTZ001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
